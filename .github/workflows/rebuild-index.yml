# Auto-rebuild + deploy when the knowledge base or prompt changes.
#
# This makes "add a product manual" a no-code task: edit or add a file under
# knowledge/ on github.com (web editor is fine), commit to this branch, and CI
# re-embeds the index and ships it to production. No local setup needed.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   VOYAGE_API_KEY  - same key as in Vercel env (embeds the manual chunks)
#   VERCEL_TOKEN    - create at vercel.com/account/tokens
name: rebuild-index

on:
  push:
    branches: [deploy/vercel-postgres-voyage]
    paths:
      - "knowledge/**"
      - "app/prompts/**"
      - "scripts/build-index.mjs"
  workflow_dispatch:

concurrency:
  group: rebuild-index
  cancel-in-progress: false

jobs:
  rebuild-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERCEL_ORG_ID: team_RyfAcoo8iP0kD6ggjQaYQTYU
      VERCEL_PROJECT_ID: prj_F15fMCSVhFynYPHmgwPRgaLPNEDz
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so the pull --rebase below always finds a base

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild manual index (Voyage embeddings)
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: node scripts/build-index.mjs

      - name: Commit regenerated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A prompt-only change rebuilds an identical index except for its
          # createdAt timestamp; skip that noise commit (the deploy below
          # still ships the prompt change).
          if node scripts/index-unchanged.mjs; then
            echo "Index content unchanged (timestamp only); nothing to commit."
            git checkout -- data/manual-index.json
          else
            git add data/manual-index.json
            git commit -m "chore(index): rebuild from knowledge change [auto]"
          fi
          # Someone may have pushed while the index was rebuilding. Replay on
          # top of the branch tip (instead of failing a non-fast-forward push),
          # and so the deploy below ships the tip, never an older commit.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Deploy to Vercel production
        run: npx vercel deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
